name: Build PZO Zomdroid (Android ARM64 Native & JAR)

on:
  workflow_dispatch:

jobs:
  build-zomdroid:
    name: Build Android ARM64 Native & PZOptimEngine.jar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Compile Android ARM64 libpzo_native64.so
        run: |
          chmod +x native/build_native.sh
          bash native/build_native.sh
          file dist/libpzo_native64.so
          ls -lh dist/libpzo_native64.so

      - name: Package PZOptimEngine.jar & Release Archives
        run: |
          python3 package_release.py
          ls -lh dist/

      - name: Upload Zomdroid Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pzo-zomdroid-android-arm64
          path: |
            dist/PZOptimEngine.jar
            dist/libpzo_native64.so

      - name: Commit Android ARM64 Native & JAR to zomdroid branch
        run: |
          git config user.name "prop11"
          git config user.email "prop11@users.noreply.github.com"
          git add native/libpzo_native64.so PZOptimEngine.jar dist/PZO_Optimizer_macOS_Linux.zip
          if ! git diff --staged --quiet; then
            git commit -m "Compile Android ARM64 libpzo_native64.so and bundle into PZOptimEngine.jar [skip ci]"
            git push origin HEAD:zomdroid
          fi
