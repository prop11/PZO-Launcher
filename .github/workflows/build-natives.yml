name: Build Native Binaries

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/build-natives.yml'
    branches:
      - main

jobs:
  build-linux:
    name: Build Native (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compile libpzo_native64.so
        run: |
          chmod +x native/build_native.sh
          if bash native/build_native.sh > /tmp/build.log 2>&1; then
            cat /tmp/build.log
            echo "### Linux Build Succeeded" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Linux Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/build.log
            exit 1
          fi
          ls -lh dist/libpzo_native64.so

      - name: Upload Linux native artifact
        uses: actions/upload-artifact@v4
        with:
          name: libpzo_native64-linux
          path: dist/libpzo_native64.so

  build-macos:
    name: Build Native (macOS Universal arm64/x86_64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compile libpzo_native64.dylib
        run: |
          chmod +x native/build_native.sh
          if bash native/build_native.sh > /tmp/build.log 2>&1; then
            cat /tmp/build.log
            echo "### macOS Build Succeeded" >> $GITHUB_STEP_SUMMARY
          else
            echo "### macOS Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/build.log
            exit 1
          fi
          ls -lh dist/libpzo_native64.dylib

      - name: Upload macOS native artifact
        uses: actions/upload-artifact@v4
        with:
          name: libpzo_native64-macos
          path: dist/libpzo_native64.dylib
